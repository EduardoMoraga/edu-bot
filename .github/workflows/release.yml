# Draft GitHub releases for Edu Bot.
# A push of a tag v* that matches package.json publishes a draft on this repository.
# workflow_dispatch builds the same installers; dry_run (the default) does not publish.
# Signing and notarization run only when the matching secrets are set.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke, but do not publish a draft"
        required: false
        type: boolean
        default: true
      ship_without_ci:
        description: "Emergency only: skip waiting for the commit's passing CI check"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      should_release: ${{ steps.pin.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              v*) ;;
              *) echo "::error::tag $GITHUB_REF_NAME is not v*"; exit 1 ;;
            esac
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          fi
          node scripts/record-data-format.mjs
          git diff --exit-code -- server/data-format-released.json

  ci:
    name: CI passed on the release commit
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-ci.mjs
            scripts/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Wait for the CI check on the pinned commit
        if: ${{ !inputs.ship_without_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-ci.mjs

  mac:
    name: macOS arm64 + x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Decide whether to sign and notarize
        id: sign
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          sign=false
          notarize=false
          if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$MAC_CERT_PASSWORD" ]; then
            sign=true
          fi
          if [ "$sign" = true ] && [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            notarize=true
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          {
            if [ "$sign" = true ]; then
              echo "macOS: signed with the Developer ID certificate in the repository secrets."
            else
              echo "macOS: unsigned. MAC_CERT_P12_BASE64 and MAC_CERT_PASSWORD are not both set, so the dmg and zip are not signed."
            fi
            if [ "$notarize" = true ]; then
              echo "macOS: notarized and stapled."
            else
              echo "macOS: not notarized."
            fi
          } > "$RUNNER_TEMP/SIGNING-mac.txt"
      - name: Import the Developer ID certificate into a throwaway keychain
        if: steps.sign.outputs.sign == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package both architectures
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          if [ "${{ steps.sign.outputs.sign }}" = "true" ]; then
            node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              const path = "electron-builder.yml";
              const text = readFileSync(path, "utf8");
              const next = text.replace("\n  sign: false\n", "\n  sign: true\n");
              if (next === text) throw new Error("dmg sign: false was not found");
              writeFileSync(path, next);
            '
            pnpm package:mac
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            pnpm package:mac -- -c.mac.identity=null
          fi
      - name: Check both apps, then launch this runner's app once
        run: |
          set -euo pipefail
          for app in "release/mac-arm64/Edu Bot.app" "release/mac/Edu Bot.app"; do
            res="$app/Contents/Resources"
            update="$res/app-update.yml"
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq '^owner: EduardoMoraga$' "$update" || { echo "::error::wrong update owner in $update"; exit 1; }
            grep -Eq '^repo: edu-bot$' "$update" || { echo "::error::wrong update repo in $update"; exit 1; }
            for banned in browser-engine android-platform-tools; do
              if [ -e "$res/$banned" ]; then
                echo "::error::$res/$banned must not be packaged"
                exit 1
              fi
            done
            test -x "$res/cloudflared/cloudflared" || { echo "::error::missing cloudflared in $app"; exit 1; }
            test -f "$res/licenses/cloudflared-LICENSE.txt" || { echo "::error::missing cloudflared license in $app"; exit 1; }
            OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node scripts/check-module-scopes.mjs "$res"
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, file]) => !existsSync(file));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          EOF
            speech="$res/Edu Bot Speech.app/Contents/MacOS/speech-helper"
            lipo -archs "$speech" | grep -q "x86_64"
            lipo -archs "$speech" | grep -q "arm64"
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            for bin in "$res/cua-driver" "$res/cua-sdk/native/libcua_driver_sdk.dylib" \
              "$res/cua-sdk/native/cua_driver_node_runtime.node" "$res/cloudflared/cloudflared"; do
              test "$(lipo -archs "$bin")" = "$expected_arch" || {
                echo "::error::$bin is not the expected $expected_arch executable"; exit 1; }
            done
            if [ "$(uname -m)" = "$expected_arch" ]; then
              "$res/cloudflared/cloudflared" version | grep -Fq "cloudflared version 2026.10.3 "
            fi
          done
          case "$(uname -m)" in
            arm64) app="release/mac-arm64/Edu Bot.app" ;;
            x86_64) app="release/mac/Edu Bot.app" ;;
            *) echo "::error::unexpected arch $(uname -m)"; exit 1 ;;
          esac
          bin="$app/Contents/MacOS/Edu Bot"
          test -x "$bin"
          home="$RUNNER_TEMP/edu-bot-launch"
          rm -rf "$home"
          mkdir -p "$home/data" "$home/config" "$home/cache"
          log="$RUNNER_TEMP/edu-bot-launch.log"
          HOME="$home" OMB_DATA_DIR="$home/data" XDG_CONFIG_HOME="$home/config" \
            XDG_CACHE_HOME="$home/cache" XDG_DATA_HOME="$home/data" \
            "$bin" --user-data-dir="$home/chromium" >"$log" 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::Edu Bot exited during launch"
            cat "$log" || true
            exit 1
          fi
          kill "$pid" || true
          sleep 1
          kill -9 "$pid" 2>/dev/null || true
          echo "launched $bin"
      - name: Verify the Developer ID signature
        if: steps.sign.outputs.sign == 'true'
        run: |
          set -euo pipefail
          for app in "release/mac-arm64/Edu Bot.app" "release/mac/Edu Bot.app"; do
            codesign --verify --deep --strict "$app"
            bin="$app/Contents/Resources/cloudflared/cloudflared"
            codesign --verify --strict "$bin"
            app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$app_team" && test "$bin_team" = "$app_team"
          done
      - name: Notarize the dmg and zip
        if: steps.sign.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/notary.p8"' EXIT
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          notary() {
            xcrun notarytool "$@" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
          }
          for f in release/*.dmg release/*.zip; do
            rc=0
            out=$(notary submit "$f" --wait 2>&1) || rc=$?
            if [ "$rc" -eq 0 ] && echo "$out" | grep -q "status: Accepted"; then
              echo "$out" | tail -2
              continue
            fi
            echo "$out"
            echo "::error::notarization not Accepted for $f (notarytool exit code $rc)"
            exit 1
          done
      - name: Staple and refresh the macOS feed
        if: steps.sign.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          staple() {
            for attempt in 1 2 3 4 5 6; do
              xcrun stapler staple "$1" && return 0
              echo "stapling $1 failed (attempt $attempt of 6); trying again in 30 s"
              sleep 30
            done
            echo "::error::could not staple $1 after 6 attempts"
            return 1
          }
          for f in release/EduBot-*-arm64.dmg release/EduBot-*-x64.dmg "release/mac-arm64/Edu Bot.app" "release/mac/Edu Bot.app"; do
            staple "$f"
          done
          v=$(node -p "require('./package.json').version")
          rm -f "release/EduBot-$v-arm64.zip" "release/EduBot-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent "release/mac-arm64/Edu Bot.app" "release/EduBot-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "release/mac/Edu Bot.app" "release/EduBot-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/EduBot-$v-arm64.zip" "release/EduBot-$v-x64.zip" \
            "release/EduBot-$v-arm64.dmg" "release/EduBot-$v-x64.dmg"
          node scripts/regenerate-mac-feed.mjs
      - name: Require the macOS artifacts
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          for name in \
            "EduBot-$v-arm64.dmg" "EduBot-$v-arm64.dmg.blockmap" \
            "EduBot-$v-arm64.zip" "EduBot-$v-arm64.zip.blockmap" \
            "EduBot-$v-x64.dmg" "EduBot-$v-x64.dmg.blockmap" \
            "EduBot-$v-x64.zip" "EduBot-$v-x64.zip.blockmap" \
            latest-mac.yml
          do
            test -f "release/$name" || { echo "::error::missing release/$name"; ls -lh release; exit 1; }
          done
          cp "$RUNNER_TEMP/SIGNING-mac.txt" release/SIGNING-mac.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/SIGNING-mac.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release
      - name: Package Windows x64
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${WIN_CSC_LINK:-}" ] || [ -n "${CSC_LINK:-}" ]; then
            echo "Windows: signed with WIN_CSC_LINK or CSC_LINK." > "$RUNNER_TEMP/SIGNING-windows.txt"
          else
            unset WIN_CSC_LINK CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Windows: unsigned. WIN_CSC_LINK and CSC_LINK are not set, so SmartScreen will show an unknown publisher." > "$RUNNER_TEMP/SIGNING-windows.txt"
          fi
          pnpm package:win
          cp "$RUNNER_TEMP/SIGNING-windows.txt" release/SIGNING-windows.txt
      - name: Check the package, start the server, and launch the app once
        run: |
          set -euo pipefail
          res=release/win-unpacked/resources
          for banned in browser-engine android-platform-tools; do
            if [ -e "$res/$banned" ]; then
              echo "::error::$res/$banned must not be packaged"
              exit 1
            fi
          done
          test -f "$res/server/index.js"
          test -f "$res/server/desktop-entry.mjs"
          test -f "$res/ui/index.html"
          test -f "$res/cloudflared/cloudflared.exe"
          test -f "$res/licenses/cloudflared-LICENSE.txt"
          test -f "$res/licenses/cloudflared-README.md"
          node scripts/check-module-scopes.mjs "$res"
          expected=$(node --input-type=module -e "import { CLOUDFLARED_ASSETS } from './scripts/prepare-cloudflared.mjs'; console.log(Object.values(CLOUDFLARED_ASSETS).find((asset) => asset.name === 'cloudflared-windows-amd64.exe').binarySha256)")
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          test "$actual" = "$expected"
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.10.3 "
          test -f "$res/app-update.yml"
          grep -Eq '^owner: EduardoMoraga$' "$res/app-update.yml"
          grep -Eq '^repo: edu-bot$' "$res/app-update.yml"
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"
            exit 1
          fi
          home="$RUNNER_TEMP/edu-bot-server"
          mkdir -p "$home"
          HOME="$home" USERPROFILE="$home" APPDATA="$home/roaming" OMB_DATA_DIR="$home/data" OMB_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          kill $pid 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "::error::the packaged server never served /api/health"
            cat "$RUNNER_TEMP/server.log" || true
            exit 1
          fi
          exe="release/win-unpacked/Edu Bot.exe"
          test -f "$exe"
          launch="$RUNNER_TEMP/edu-bot-launch"
          mkdir -p "$launch/data" "$launch/roaming"
          HOME="$launch" USERPROFILE="$launch" APPDATA="$launch/roaming" OMB_DATA_DIR="$launch/data" \
            "$exe" --user-data-dir="$launch/chromium" > "$RUNNER_TEMP/app.log" 2>&1 &
          app_pid=$!
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null && ! tasklist //FI "IMAGENAME eq Edu Bot.exe" | grep -q "Edu Bot.exe"; then
            echo "::error::Edu Bot.exe exited during launch"
            cat "$RUNNER_TEMP/app.log" || true
            exit 1
          fi
          kill "$app_pid" 2>/dev/null || true
          taskkill //F //IM "Edu Bot.exe" //T >/dev/null 2>&1 || true
          echo "launched $exe"
          v=$(node -p "require('./package.json').version")
          test -f "release/EduBot-$v-setup.exe"
          test -f "release/EduBot-$v-setup.exe.blockmap"
          test -f release/latest.yml
          test -f release/SIGNING-windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*-setup.exe
            release/*-setup.exe.blockmap
            release/latest.yml
            release/SIGNING-windows.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core cpio dbus-x11 desktop-file-utils libxi6 libxkbcommon0 openbox rpm squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package Linux x64
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          pnpm package:linux
          echo "Linux: unsigned. No Linux signing secret is configured." > release/SIGNING-linux.txt
      - name: Verify the packaged updater target
        run: |
          set -euo pipefail
          update=release/linux-unpacked/resources/app-update.yml
          test -f "$update"
          grep -Eq '^owner: EduardoMoraga$' "$update"
          grep -Eq '^repo: edu-bot$' "$update"
          for banned in browser-engine android-platform-tools; do
            if [ -e "release/linux-unpacked/resources/$banned" ]; then
              echo "::error::linux-unpacked resources/$banned must not be packaged"
              exit 1
            fi
          done
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          set -euo pipefail
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place deb upgrade
        run: |
          set -euo pipefail
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
          for banned in browser-engine android-platform-tools; do
            if [ -e "/opt/edu-bot/resources/$banned" ]; then
              echo "::error::/opt/edu-bot/resources/$banned must not be installed"
              exit 1
            fi
          done
      - name: Configure the Electron sandbox for the unpacked app
        run: |
          set -euo pipefail
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Launch the unpacked app, the AppImage, and the installed deb
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: |
          set -euo pipefail
          node scripts/check-module-scopes.mjs "/opt/edu-bot/resources"
          pnpm smoke:linux-package
      - name: Remove the installed package
        if: always()
        run: sudo dpkg --purge edu-bot || true
      - name: Require the Linux artifacts
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          test -f "release/EduBot-$v-x86_64.AppImage"
          test -f "release/EduBot-$v-amd64.deb"
          test -f release/latest-linux.yml
          test -f release/SIGNING-linux.txt
          chmod 0755 "release/EduBot-$v-x86_64.AppImage"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/latest-linux.yml
            release/SIGNING-linux.txt
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble the draft
    needs: [prepare, ci, mac, windows, linux]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Check the installers and write SHA256SUMS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd assets
          required=(
            "EduBot-$VERSION-arm64.dmg"
            "EduBot-$VERSION-arm64.dmg.blockmap"
            "EduBot-$VERSION-arm64.zip"
            "EduBot-$VERSION-arm64.zip.blockmap"
            "EduBot-$VERSION-x64.dmg"
            "EduBot-$VERSION-x64.dmg.blockmap"
            "EduBot-$VERSION-x64.zip"
            "EduBot-$VERSION-x64.zip.blockmap"
            "EduBot-$VERSION-setup.exe"
            "EduBot-$VERSION-setup.exe.blockmap"
            "EduBot-$VERSION-amd64.deb"
            "EduBot-$VERSION-x86_64.AppImage"
            latest-mac.yml
            latest.yml
            latest-linux.yml
            SIGNING-mac.txt
            SIGNING-windows.txt
            SIGNING-linux.txt
          )
          for name in "${required[@]}"; do
            test -f "$name" || { echo "::error::missing $name"; ls -lh; exit 1; }
          done
          if ls ./*.rpm >/dev/null 2>&1; then
            echo "::error::rpm must not be uploaded"
            exit 1
          fi
          sha256sum \
            "EduBot-$VERSION-arm64.dmg" \
            "EduBot-$VERSION-arm64.zip" \
            "EduBot-$VERSION-x64.dmg" \
            "EduBot-$VERSION-x64.zip" \
            "EduBot-$VERSION-setup.exe" \
            "EduBot-$VERSION-amd64.deb" \
            "EduBot-$VERSION-x86_64.AppImage" \
            > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish a draft, or stop when this is a dry run
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            publish=true
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = false ] && [ "$REF_TYPE" = tag ]; then
            publish=true
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Edu Bot $VERSION"
            echo
            echo "Signing:"
            echo
            sed 's/^/- /' assets/SIGNING-mac.txt assets/SIGNING-windows.txt assets/SIGNING-linux.txt
            echo
            echo "SHA256SUMS lists the installers. Desktop auto-update is off."
          } > "$notes"
          cat "$notes"
          echo "----- SHA256SUMS -----"
          cat assets/SHA256SUMS
          if [ "$publish" != true ]; then
            echo "dry run: installers were built and checked; no release was created"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --jq .ref >/dev/null; then
            echo "::error::refusing to create v$VERSION because that tag does not exist"
            exit 1
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$SHA" \
            --title "Edu Bot $VERSION" \
            --notes-file "$notes" \
            "assets/EduBot-$VERSION-arm64.dmg" \
            "assets/EduBot-$VERSION-arm64.dmg.blockmap" \
            "assets/EduBot-$VERSION-arm64.zip" \
            "assets/EduBot-$VERSION-arm64.zip.blockmap" \
            "assets/EduBot-$VERSION-x64.dmg" \
            "assets/EduBot-$VERSION-x64.dmg.blockmap" \
            "assets/EduBot-$VERSION-x64.zip" \
            "assets/EduBot-$VERSION-x64.zip.blockmap" \
            "assets/EduBot-$VERSION-setup.exe" \
            "assets/EduBot-$VERSION-setup.exe.blockmap" \
            "assets/EduBot-$VERSION-amd64.deb" \
            "assets/EduBot-$VERSION-x86_64.AppImage" \
            assets/latest-mac.yml \
            assets/latest.yml \
            assets/latest-linux.yml \
            assets/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: edu-bot-release-assets
          path: |
            assets/SHA256SUMS
            assets/SIGNING-mac.txt
            assets/SIGNING-windows.txt
            assets/SIGNING-linux.txt
          if-no-files-found: warn
          retention-days: 7
